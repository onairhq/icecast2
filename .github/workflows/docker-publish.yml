name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: icecast2-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/onairhq/icecast2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version from Git tag
        id: version
        shell: bash
        env:
          GIT_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${GIT_REF#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GIT_REF"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/onairhq/icecast2:${{ steps.version.outputs.version }}
            ghcr.io/onairhq/icecast2:${{ steps.version.outputs.minor }}
            ghcr.io/onairhq/icecast2:latest
          labels: |
            org.opencontainers.image.source=https://github.com/onairhq/icecast2
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
